[package]
name = "sanity-sc-rs"
version = "0.2.0"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
description = "Bayesian inference of gene expression states from single cell UMI counts. A clean-room Rust implementation of the Sanity method, returning posterior log expression levels and their error bars."
repository = "https://github.com/GregorLueg/sanity-sc-rs"
keywords = ["bioinformatics", "single-cell", "normalisation", "bayesian", "rna-seq"]
categories = [
    "algorithms",
    "science::bioinformatics",
    "science::computational-biology",
]

[lib]
name = "sanity_sc_rs"
path = "src/lib.rs"

[features]
## Default build: pure CPU, no GPU runtime.
default = []
## Enables the CubeCL/wgpu path in `crate::gpu`.
gpu = ["cubecl", "cubecl-utils-rs"]
## Enables the tests that need a wgpu adapter on the machine.
gpu-tests = ["gpu"]

[dependencies]
cubecl = { version = "0.10.0", features = ["wgpu"], optional = true }
cubecl-utils-rs = { version = "0.1.0", optional = true }
num-traits = "0.2.19"
rayon = "1.11.0"
rand = "0.9.2"
rand_distr = "0.5.1"
thiserror = "2.0.18"

[dev-dependencies]
approx = "0.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.test]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true

[[example]]
name = "profile_gpu"
required-features = ["gpu"]

[[test]]
name = "gpu"
required-features = ["gpu-tests"]
